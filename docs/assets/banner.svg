<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="ai-memory-system — persistent, cross-project memory for coding agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="13" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- ============ left: mark + name ============ -->
  <!-- memory-layer stack -->
  <g transform="translate(64,84)">
    <rect x="0"  y="70" width="120" height="30" rx="8" fill="#1d4ed8" opacity="0.55"/>
    <rect x="10" y="35" width="100" height="30" rx="8" fill="#0ea5e9" opacity="0.75"/>
    <rect x="20" y="0"  width="80"  height="30" rx="8" fill="url(#accent)"/>
    <!-- cap ticks: each layer is capped -->
    <line x1="130" y1="85" x2="146" y2="85" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="50" x2="146" y2="50" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="110" y1="15" x2="146" y2="15" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- search glass over the stack -->
    <g transform="translate(96,58)">
      <circle cx="0" cy="0" r="26" fill="#0f172a" opacity="0.35"/>
      <circle cx="0" cy="0" r="26" fill="none" stroke="#e2e8f0" stroke-width="7"/>
      <line x1="19" y1="19" x2="44" y2="44" stroke="#e2e8f0" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <text x="248" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="46" font-weight="700" fill="#f1f5f9">ai-memory-system</text>
  <text x="250" y="180" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#94a3b8">Persistent, cross-project memory for coding agents.</text>
  <text x="250" y="212" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#64748b">Markdown files plus a few hooks — no database, no service, no vendor.</text>

  <!-- ============ right: the pipeline ============ -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" text-anchor="middle">
    <!-- session -->
    <rect x="800" y="52" width="130" height="40" rx="9" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="865" y="77" fill="#e2e8f0">session</text>
    <!-- transcript -->
    <rect x="990" y="52" width="146" height="40" rx="9" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="1063" y="77" fill="#cbd5e1">transcript</text>
    <!-- daily log -->
    <rect x="990" y="132" width="146" height="40" rx="9" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="1063" y="157" fill="#cbd5e1">daily log</text>
    <!-- memory -->
    <rect x="800" y="132" width="130" height="40" rx="9" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="865" y="157" fill="#e2e8f0">MEMORY.md</text>
    <!-- curator -->
    <rect x="800" y="220" width="336" height="42" rx="9" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="968" y="246" fill="#94a3b8">curator — vetoes deletion &#8805;50%</text>

    <!-- arrows -->
    <g stroke="#64748b" stroke-width="2" fill="none">
      <path d="M930 72 H984"/>
      <path d="M984 72 l-8 -5 v10 z" fill="#64748b" stroke="none"/>
      <path d="M1063 92 V126"/>
      <path d="M1063 126 l-5 -8 h10 z" fill="#64748b" stroke="none"/>
      <path d="M990 152 H936"/>
      <path d="M936 152 l8 -5 v10 z" fill="#64748b" stroke="none"/>
      <path d="M865 132 V98"/>
      <path d="M865 98 l-5 8 h10 z" fill="#64748b" stroke="none"/>
      <path d="M865 172 V214" stroke-dasharray="4 4"/>
      <path d="M865 214 l-5 -8 h10 z" fill="#64748b" stroke="none"/>
    </g>
    <!-- loop label: memory feeds the next session -->
    <text x="900" y="120" fill="#475569" font-size="12" text-anchor="start">injected at start</text>
  </g>

  <!-- retrieval ladder strip -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="250" y="262" fill="#64748b">retrieval:</text>
    <text x="345" y="262" fill="#38bdf8">context</text>
    <text x="418" y="262" fill="#475569">&#8594;</text>
    <text x="443" y="262" fill="#7dd3fc">grep</text>
    <text x="489" y="262" fill="#475569">&#8594;</text>
    <text x="514" y="262" fill="#a78bfa">vector</text>
    <text x="580" y="262" fill="#475569">&#8594;</text>
    <text x="605" y="262" fill="#c4b5fd">transcripts</text>
  </g>
</svg>
